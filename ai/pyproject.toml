[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-ai"
version = "0.1.0"
description = "AI layer for the Meeting Intelligence System: parsing, chunking, embeddings, retrieval, RAG and meeting intelligence extraction."
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5",
    "sentence-transformers>=2.7",
    "openai>=1.30",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["meeting_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
